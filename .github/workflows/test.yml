name: Test

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: formatting, vet and the UI's own type check. Everything here is
  # platform-neutral, so it runs on Linux and reports quickly -- a PR that
  # fails gofmt shouldn't have to wait for a FreeBSD VM to boot.
  check:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: svelte-check / tsc
        working-directory: ui
        run: npm run check

      - name: UI tests
        working-directory: ui
        run: npm test

      # Must come before any Go step: ui/embed.go embeds ui/dist, which is
      # gitignored, so `go vet`/`go build` fail with "pattern dist/*: no
      # matching files found" until the UI has been built.
      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: go vet
        run: go vet ./...

      # Hand the built UI to the FreeBSD lane so it doesn't need node at all.
      - name: Upload UI assets
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1
          if-no-files-found: error

  # Authoritative lane: fjordd targets FreeBSD, so the tests run there. The
  # suite is pure Go with no jails or ZFS, but running it on the real platform
  # is what keeps a FreeBSD-only assumption from reaching a release untested.
  test-freebsd:
    name: Go tests (FreeBSD 15)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download UI assets
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: go test ./...
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: "15"
          usesh: true
          copyback: false
          prepare: |
            pkg update
            pkg install -y go git
          run: |
            set -e
            export GOFLAGS=-buildvcs=false
            go version
            test -f ui/dist/index.html || { echo "ui/dist missing"; exit 1; }
            go build ./...
            # Vet here as well as in the Linux lane: platform_freebsd.go is
            # behind a build tag, so a Linux-only vet never sees it.
            go vet ./...
            go test ./... 2>&1
